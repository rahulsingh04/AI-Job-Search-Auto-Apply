[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-auto-apply"
version = "0.3.0"
description = "AI-powered job-application email sender using local Ollama models and Streamlit UI"
authors = [
    { name = "RAHUL KUMAR SINGH" }
]
requires-python = ">=3.10"

dependencies = [
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "pytest>=7.0.0",
]

[tool.setuptools]
py-modules = ["config_loader", "email_db_helper"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_email_writer*", "email_sender*"]
