[tool.poetry]
name = "ai-job-auto-apply"
version = "0.3.0"
description = "AI-powered job-application email sender using local Ollama models and Streamlit UI"
authors = ["RAHUL KUMAR SINGH <javarahul04@gmail.com>"]
readme = "README.md"
packages = [
    { include = "ai_email_writer", from = "src" },
    { include = "email_sender", from = "src" },
    { include = "config_loader.py", from = "src" },
    { include = "email_db_helper.py", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-ollama = ">=1.1.0,<2.0.0"
langchain-core = ">=1.0.0,<2.0.0"
pydantic = ">=2.7.0,<3.0.0"
streamlit = ">=1.30.0,<2.0.0"
pandas = ">=2.0.0,<3.0.0"
numpy = ">=1.24.0,<3.0.0"
openpyxl = ">=3.1.0,<4.0.0"
pypdf = ">=4.0.0,<7.0.0"
python-docx = ">=1.1.0,<2.0.0"
watchdog = ">=3.0.0,<7.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29"
pytest = ">=7.0.0"

[build-system]
requires = ["poetry-core>=1.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
